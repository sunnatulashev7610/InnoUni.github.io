<!DOCTYPE html>
<html lang="uz">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>O'qituvchi boshqaruv paneli - Gather Edu</title>
	<script>(function(){var t=null;try{t=localStorage.getItem('geTheme')}catch(e){}document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')})()</script>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400..700&display=swap">
	<link rel="stylesheet" href="../style/theme.css">
	<link rel="stylesheet" href="../css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<style>
		.teacher-dashboard {
			background: var(--brand);
			color: var(--ink);
			font-family: 'Onest', system-ui, 'Segoe UI', sans-serif;
			min-height: 100vh;
		}

		.dashboard-container {
			max-width: 1400px;
			margin: 0 auto;
			padding: 20px;
		}

		.stats-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
			gap: 20px;
			margin-bottom: 30px;
		}

		.content-section {
			background: var(--surface);
			border-radius: var(--r-lg);
			padding: 30px;
			margin-bottom: 20px;
			border: 1px solid var(--line);
		}

		.section-title {
			font-size: 22px;
			font-weight: bold;
			margin-bottom: 20px;
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.courses-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
			gap: 25px;
			margin-bottom: 30px;
		}

		.course-card {
			background: var(--surface);
			border-radius: var(--r-lg);
			padding: 25px;
			border: 1px solid var(--line);
			transition: all 0.3s ease;
			cursor: pointer;
		}

		.course-card:hover {
			
			border-color: var(--brand);
		}

		.course-header {
			display: flex;
			align-items: center;
			gap: 15px;
			margin-bottom: 20px;
		}

		.course-avatar {
			width: 60px;
			height: 60px;
			border-radius: 12px;
			object-fit: cover;
			border: 2px solid var(--brand);
		}

		.course-info h4 {
			margin: 0;
			font-size: 18px;
			font-weight: bold;
			color: var(--ink);
		}

		.course-meta {
			display: flex;
			flex-direction: column;
			gap: 5px;
		}

		.course-category {
			background: var(--brand);
			color: var(--bg);
			padding: 4px 8px;
			border-radius: 12px;
			font-size: 12px;
			width: fit-content;
		}

		.course-teacher {
			color: var(--ink-2);
			font-size: 14px;
		}

		.course-status {
			padding: 4px 8px;
			border-radius: 12px;
			font-size: 12px;
			font-weight: bold;
		}

		.status-active {
			background: var(--ok);
		}

		.status-inactive {
			background: var(--brand);
		}

		.course-stats {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			gap: 15px;
			margin-bottom: 20px;
		}

		.stat-item {
			text-align: center;
			padding: 15px;
			background: var(--surface-2);
			border-radius: 10px;
		}

		.stat-number {
			font-size: 20px;
			font-weight: bold;
			color: var(--brand);
		}

		.stat-label {
			color: var(--ink-2);
			font-size: 12px;
			margin-top: 5px;
		}

		.course-actions {
			display: flex;
			gap: 10px;
		}

		.action-btn {
			padding: 10px 20px;
			border-radius: 8px;
			border: none;
			cursor: pointer;
			font-size: 14px;
			transition: all 0.3s ease;
		}

		.btn-view {
			background: var(--surface-2);
			color: var(--bg);
			border: 1px solid var(--line-strong);
		}

		.btn-primary {
			background: var(--brand);
			color: var(--bg);
		}

		.btn-success {
			background: var(--ok);
			color: var(--bg);
		}

		.btn-info {
			background: var(--info);
			color: var(--bg);
		}

		.action-btn:hover {
			box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
		}

		.activity-container {
			max-height: 400px;
			overflow-y: auto;
		}

		.activity-list {
			display: flex;
			flex-direction: column;
			gap: 15px;
		}

		.activity-item {
			display: flex;
			align-items: center;
			gap: 15px;
			padding: 15px;
			border-radius: 10px;
			background: var(--surface-2);
			transition: all 0.3s ease;
		}

		.activity-item:hover {
			background: var(--surface-2);
		}

		.activity-icon {
			width: 40px;
			height: 40px;
			border-radius: 10px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 16px;
		}

		.activity-icon.enrollment {
			background: var(--brand);
		}

		.activity-icon.task_completion {
			background: var(--ok);
		}

		.activity-icon.course_completion {
			background: var(--warn);
		}

		.activity-details {
			flex: 1;
		}

		.activity-title {
			font-weight: bold;
			margin-bottom: 5px;
		}

		.activity-time {
			color: var(--ink-2);
			font-size: 12px;
		}

		.activity-progress {
			margin-top: 10px;
		}

		.progress-info {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.progress-bar {
			width: 100%;
			height: 6px;
			background: var(--surface-2);
			border-radius: 3px;
			overflow: hidden;
			margin-top: 5px;
		}

		.progress-fill {
			height: 100%;
			background: var(--brand);
			border-radius: 3px;
			transition: width 0.3s ease;
		}

		.quick-actions-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
			gap: 20px;
		}

		.quick-action-card {
			background: var(--surface);
			border-radius: var(--r-lg);
			padding: 25px;
			text-align: center;
			border: 1px solid var(--line);
			transition: all 0.3s ease;
			cursor: pointer;
		}

		.quick-action-card:hover {
			border-color: var(--brand);
		}

		.action-icon {
			font-size: 32px;
			margin-bottom: 15px;
			color: var(--brand);
		}

		.action-icon h4 {
			margin: 0;
			color: var(--ink);
		}

		.action-icon p {
			margin: 0;
			color: var(--ink-2);
			font-size: 14px;
		}

		@media (max-width: 768px) {
			.stats-grid {
				grid-template-columns: repeat(2, 1fr);
			}

			.courses-grid {
				grid-template-columns: 1fr;
			}

			.course-stats {
				grid-template-columns: repeat(2, 1fr);
			}

			.course-actions {
				flex-direction: column;
			}
		}
	
		.stat-icon { background: none; color: var(--brand-ink); }
		.fg-muted { color: var(--ink-2); }
	</style>
</head>

<body>
	<button type="button" class="theme-toggle" data-theme-toggle aria-label="Tungi rejimga o'tish" aria-pressed="false" style="position:fixed;top:14px;right:14px;z-index:50"><i class="fas fa-sun ico-sun"></i><i class="fas fa-moon ico-moon"></i></button>
	<div class="teacher-dashboard">
		<div class="dashboard-container">
			<!-- Header with search -->
			<div class="content-section">
				<div class="row align-items-center">
					<div class="col-md-8">
						<div class="user-info">
							<!-- User info will be populated by JS -->
						</div>
					</div>
					<div class="col-md-4">
						<input type="text" class="form-control search-bar"
							placeholder="Kurslar, talabalar, vazifalarni qidirish...">
					</div>
				</div>
			</div>

			<!-- Statistics Grid -->
			<div class="stats-grid">
				<!-- Stats will be populated by JS -->
			</div>

			<!-- Courses Overview -->
			<div class="content-section">
				<div class="courses-header">
					<h2 class="section-title">
						<i class="fas fa-book-open me-2"></i>
						Mening kurslarim
					</h2>
					<button class="create-course-btn">
						<i class="fas fa-plus me-2"></i>Yangi kurs yaratish
					</button>
				</div>
				<div class="courses-grid">
					<!-- Courses will be populated by JS -->
				</div>
			</div>

			<!-- Recent Activities -->
			<div class="content-section">
				<h2 class="section-title">
					<i class="fas fa-clock-rotate-left me-2"></i>
					So'nggi faoliyat
				</h2>
				<div class="activity-container">
					<!-- Activities will be populated by JS -->
				</div>
			</div>

			<!-- Quick Actions -->
			<div class="quick-actions-container">
				<h2 class="section-title">
					<i class="fas fa-bolt me-2"></i>
					Tezkor amallar
				</h2>
				<div class="quick-actions-grid">
					<div class="quick-action-card" data-action="create-course">
						<div class="action-icon">
							<i class="fas fa-plus-circle"></i>
						</div>
						<h4>Yangi kurs</h4>
						<p>Yangi kurs yarating</p>
					</div>
					<div class="action-icon">
						<i class="fas fa-tasks"></i>
					</div>
					<h4>Vazifalar</h4>
					<p>Vazifalarni boshqarish</p>
				</div>
				<div class="action-icon">
					<i class="fas fa-chart-bar"></i>
				</div>
				<h4>Analitika</h4>
				<p>Batafsil statistikani ko'rish</p>
			</div>
			<div class="action-icon">
				<i class="fas fa-folder-open"></i>
			</div>
			<h4>Kutubxona</h4>
			<p>Materlallarni boshqarish</p>
		</div>
	</div>
	</div>
	</div>
	</div>
	</div>

	<script src="js/theme.js"></script>
	<script src="../frontend/js/utils.js"></script>
	<script src="../frontend/js/config.js"></script>
	<script src="../frontend/js/api.js"></script>
	<script src="../frontend/js/teacherDashboard.js"></script>
</body>

</html>
