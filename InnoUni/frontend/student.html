<!DOCTYPE html>
<html lang="uz">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>O'quvchi boshqaruv paneli - Gather Edu</title>
	<script>(function(){var t=null;try{t=localStorage.getItem('geTheme')}catch(e){}document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')})()</script>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400..700&display=swap">
	<link rel="stylesheet" href="../style/theme.css">
	<link rel="stylesheet" href="../css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<style>
		.student-dashboard {
			background: var(--brand);
			color: var(--ink);
			font-family: 'Onest', system-ui, 'Segoe UI', sans-serif;
			min-height: 100vh;
		}

		.dashboard-container {
			max-width: 1400px;
			margin: 0 auto;
			padding: 20px;
		}

		.stats-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
			gap: 20px;
			margin-bottom: 30px;
		}

		.content-section {
			background: var(--surface);
			border-radius: var(--r-lg);
			padding: 30px;
			margin-bottom: 20px;
			border: 1px solid var(--line);
			}

		.section-title {
			font-size: 22px;
			font-weight: bold;
			margin-bottom: 20px;
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.courses-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
			gap: 25px;
		}

		.course-card {
			background: var(--surface);
			border-radius: var(--r-lg);
			padding: 25px;
			border: 1px solid var(--line);
			transition: all 0.3s ease;
			cursor: pointer;
		}

		.course-card:hover {
			
			border-color: var(--brand);
		}

		.course-header {
			display: flex;
			align-items: center;
			gap: 15px;
			margin-bottom: 20px;
		}

		.course-avatar {
			width: 60px;
			height: 60px;
			border-radius: 12px;
			object-fit: cover;
			border: 2px solid var(--brand);
		}

		.course-info h4 {
			margin: 0;
			font-size: 18px;
			font-weight: bold;
			color: var(--ink);
		}

		.course-meta {
			display: flex;
			flex-direction: column;
			gap: 5px;
		}

		.course-category {
			background: var(--brand);
			color: var(--bg);
			padding: 4px 8px;
			border-radius: 12px;
			font-size: 12px;
			width: fit-content;
		}

		.course-teacher {
			color: var(--ink-2);
			font-size: 14px;
		}

		.course-progress {
			margin-bottom: 20px;
		}

		.progress-info {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 10px;
		}

		.progress-bar {
			width: 100%;
			height: 8px;
			background: var(--surface-2);
			border-radius: 4px;
			overflow: hidden;
		}

		.progress-fill {
			height: 100%;
			background: var(--brand);
			border-radius: 4px;
			transition: width 0.3s ease;
		}

		.course-stats {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 15px;
		}

		.stat-item {
			text-align: center;
			padding: 15px;
			background: var(--surface-2);
			border-radius: 10px;
		}

		.stat-number {
			font-size: 20px;
			font-weight: bold;
			color: var(--brand);
		}

		.stat-label {
			color: var(--ink-2);
			font-size: 12px;
			margin-top: 5px;
		}

		.course-actions {
			display: flex;
			gap: 10px;
		}

		.action-btn {
			padding: 10px 20px;
			border-radius: 8px;
			border: none;
			cursor: pointer;
			font-size: 14px;
			transition: all 0.3s ease;
		}

		.btn-view {
			background: var(--surface-2);
			color: var(--bg);
			border: 1px solid var(--line-strong);
		}

		.btn-primary {
			background: var(--brand);
			color: var(--bg);
		}

		.action-btn:hover {
			box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
		}

		.groups-container {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
			gap: 25px;
		}

		.group-card {
			background: var(--surface);
			border-radius: var(--r-lg);
			padding: 25px;
			border: 1px solid var(--line);
			transition: all 0.3s ease;
			cursor: pointer;
		}

		.group-card:hover {
			
			border-color: var(--brand);
		}

		.group-header {
			display: flex;
			align-items: center;
			gap: 15px;
			margin-bottom: 20px;
		}

		.group-avatar {
			width: 60px;
			height: 60px;
			border-radius: 12px;
			object-fit: cover;
			border: 2px solid var(--brand);
		}

		.group-info h4 {
			margin: 0;
			font-size: 18px;
			font-weight: bold;
			color: var(--ink);
		}

		.group-meta {
			display: flex;
			flex-direction: column;
			gap: 5px;
		}

		.group-role {
			background: var(--ok);
			color: var(--bg);
			padding: 4px 8px;
			border-radius: 12px;
			font-size: 12px;
			width: fit-content;
			}

		.member-count {
			color: var(--ink-2);
			font-size: 14px;
		}

		.group-description {
			color: var(--ink-2);
			line-height: 1.6;
			margin-bottom: 20px;
			}

		.group-stats {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 15px;
		}

		.tasks-container {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
			gap: 25px;
		}

		.task-card {
			background: var(--surface);
			border-radius: var(--r-lg);
			padding: 25px;
			border: 1px solid var(--line);
			transition: all 0.3s ease;
			position: relative;
			overflow: hidden;
		}

		.task-card:hover {
			
			border-color: var(--brand);
		}

		.task-header {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			margin-bottom: 15px;
			}

		.task-header h4 {
			margin: 0;
			font-size: 18px;
			font-weight: bold;
			color: var(--ink);
			flex: 1;
		}

		.task-meta {
			display: flex;
			flex-direction: column;
			gap: 8px;
			align-items: flex-start;
		}

		.task-priority {
			padding: 4px 8px;
			border-radius: 12px;
			font-size: 12px;
			font-weight: bold;
		}

		.priority-high {
			background: var(--danger);
		}

		.priority-medium {
			background: var(--warn);
		}

		.priority-low {
			background: var(--ok);
		}

		.task-course {
			color: var(--ink-2);
			font-size: 14px;
		}

		.task-due-date {
			color: var(--ink-2);
			font-size: 14px;
		}

		.task-due-date.overdue {
			color: #dc3545;
		}

		.task-description {
			color: var(--ink-2);
			line-height: 1.6;
			margin-bottom: 20px;
			}

		.task-actions {
			display: flex;
			gap: 10px;
		}

		.achievements-container {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
			gap: 20px;
		}

		.achievement-item {
			background: var(--surface);
			border-radius: var(--r-lg);
			padding: 20px;
			border: 1px solid var(--line);
			text-align: center;
			transition: all 0.3s ease;
		}

		.achievement-item:hover {
			border-color: var(--brand);
		}

		.achievement-icon {
			font-size: 32px;
			margin-bottom: 15px;
			color: var(--warn);
		}

		.achievement-details h5 {
			margin: 0 0 10px 0;
			font-size: 16px;
			font-weight: bold;
			color: var(--ink);
		}

		.achievement-details p {
			color: var(--ink-2);
			margin: 0;
			font-size: 14px;
		}

		.achievement-date {
			color: var(--ink-2);
			font-size: 12px;
			margin-top: 10px;
		}

		.recommendations-container {
			background: var(--surface);
			border-radius: var(--r-lg);
			padding: 30px;
			border: 1px solid var(--line);
		}

		.recommendations-section h3 {
			margin-bottom: 20px;
			color: var(--brand);
		}

		.recommended-courses {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
			gap: 20px;
			margin-bottom: 30px;
		}

		.recommended-course {
			background: var(--surface-2);
			border-radius: 10px;
			padding: 20px;
			text-align: center;
			transition: all 0.3s ease;
		}

		.recommended-course:hover {
			background: var(--surface-2);
		}

		.recommended-course h4 {
			margin: 0 0 10px 0;
			color: var(--ink);
		}

		.recommended-course p {
			color: var(--ink-2);
			margin: 0;
		}

		.enroll-btn, .join-group-btn {
			background: var(--brand);
			color: var(--bg);
			border: none;
			padding: 10px 20px;
			border-radius: 8px;
			cursor: pointer;
			transition: all 0.3s ease;
		}

		.enroll-btn:hover, .join-group-btn:hover {
			
		}

		.available-groups {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
			gap: 20px;
		}

		.available-group {
			background: var(--surface-2);
			border-radius: 10px;
			padding: 20px;
			text-align: center;
			transition: all 0.3s ease;
		}

		.available-group:hover {
			background: var(--surface-2);
		}

		.available-group h4 {
			margin: 0 0 10px 0;
			color: var(--ink);
		}

		.available-group p {
			color: var(--ink-2);
			margin: 0;
		}

		@media (max-width: 768px) {
			.stats-grid {
				grid-template-columns: repeat(2, 1fr);
			}

			.courses-grid,
			.groups-container,
			.tasks-container {
				grid-template-columns: 1fr;
			}

			.course-stats,
			.group-stats {
				grid-template-columns: 1fr;
			}

			.achievements-container {
				grid-template-columns: 1fr;
			}

			.recommended-courses,
			.available-groups {
				grid-template-columns: 1fr;
			}
		}
	
		.stat-icon { background: none; color: var(--brand-ink); }
		.fg-muted { color: var(--ink-2); }
	</style>
</head>

<body>
	<button type="button" class="theme-toggle" data-theme-toggle aria-label="Tungi rejimga o'tish" aria-pressed="false" style="position:fixed;top:14px;right:14px;z-index:50"><i class="fas fa-sun ico-sun"></i><i class="fas fa-moon ico-moon"></i></button>
	<div class="student-dashboard">
		<div class="dashboard-container">
			<!-- Header with search -->
			<div class="content-section">
				<div class="row align-items-center">
					<div class="col-md-8">
						<div class="user-info">
							<!-- User info will be populated by JS -->
						</div>
					</div>
					<div class="col-md-4">
						<input type="text" class="form-control search-bar" placeholder="Kurslar, guruhlar, vazifalarni qidirish...">
					</div>
				</div>
			</div>

			<!-- Statistics Grid -->
			<div class="stats-grid">
				<!-- Stats will be populated by JS -->
			</div>

			<!-- Enrolled Courses -->
			<div class="content-section">
				<h2 class="section-title">
					<i class="fas fa-book-open me-2"></i>
					Yozilgan kurslarim
				</h2>
				<div class="courses-container">
					<!-- Courses will be populated by JS -->
				</div>
			</div>

			<!-- Student Groups -->
			<div class="content-section">
				<h2 class="section-title">
					<i class="fas fa-users me-2"></i>
					Jamoalarim
				</h2>
				<div class="groups-container">
					<!-- Groups will be populated by JS -->
				</div>
			</div>

			<!-- Tasks -->
			<div class="content-section">
				<h2 class="section-title">
					<i class="fas fa-tasks me-2"></i>
					Vazifalarim
				</h2>
				<div class="tasks-container">
					<!-- Tasks will be populated by JS -->
				</div>
			</div>

			<!-- Achievements -->
			<div class="content-section">
				<h2 class="section-title">
					<i class="fas fa-trophy me-2"></i>
					Yutuqlarim
				</h2>
				<div class="achievements-container">
					<!-- Achievements will be populated by JS -->
				</div>
			</div>

			<!-- Recommendations -->
			<div class="recommendations-container">
				<!-- Recommendations will be populated by JS -->
			</div>
		</div>
	</div>

	<script src="js/theme.js"></script>
	<script src="../frontend/js/utils.js"></script>
	<script src="../frontend/js/config.js"></script>
	<script src="../frontend/js/api.js"></script>
	<script src="../frontend/js/studentDashboard.js"></script>
</body>

</html>
