<div class="pg">
	<div class="pg-head"><div><h1>Kurs yaratish</h1><p>Ma'lumotlarni to'ldiring, o'ng tomonda kurs qanday ko'rinishini ko'rasiz</p></div></div>
	<div class="pg-detail">
		<form class="pg-card" id="courseForm">
			<label class="pg-lbl" for="cTitle" style="margin-top:0">Kurs nomi</label><input class="pg-input" id="cTitle" value="Yangi kurs" maxlength="60" required>
			<div class="pg-two"><div><label class="pg-lbl" for="cCat">Kategoriya</label><select class="pg-input" id="cCat"><option>Frontend</option><option>Backend</option><option>Dizayn</option><option>Mobil</option><option>Til</option></select></div><div><label class="pg-lbl" for="cLevel">Daraja</label><select class="pg-input" id="cLevel"><option>Boshlang'ich</option><option>O'rta</option><option>Yuqori</option></select></div></div>
			<label class="pg-lbl" for="cDesc">Tavsif</label><textarea class="pg-input" id="cDesc" rows="3" placeholder="Kurs nimani o'rgatadi?"></textarea>
			<div class="pg-two"><div><label class="pg-lbl" for="cPrice">Narxi (so'm)</label><input class="pg-input" id="cPrice" type="number" min="0" step="1000" value="200000"></div><div><label class="pg-lbl">Muqova rangi</label><div class="pg-swatches" id="cCover" style="padding-top:8px"><i data-cover="var(--c1)" style="background:var(--c1)" class="on"></i><i data-cover="var(--c2)" style="background:var(--c2)"></i><i data-cover="var(--c3)" style="background:var(--c3)"></i><i data-cover="var(--c4)" style="background:var(--c4)"></i><i data-cover="var(--c5)" style="background:var(--c5)"></i></div></div></div>
			<label class="pg-lbl">Darslar</label>
			<div id="lessonList" class="pg-lessons"><div class="pg-lrow"><span class="n">01</span><input class="pg-input" value="Kirish"><button type="button" class="pg-x" data-action="del-lesson" aria-label="O'chirish"><i class="fas fa-xmark"></i></button></div></div>
			<button type="button" class="pg-btn ghost" data-action="add-lesson" style="margin-top:10px"><i class="fas fa-plus"></i> Dars qo'shish</button>
			<div class="pg-row" style="margin-top:14px"><div><b>Darhol nashr etish</b><span class="pg-muted">O'chiq bo'lsa, qoralama sifatida saqlanadi</span></div><label class="pg-switch"><input type="checkbox" id="cPublish" checked><span></span></label></div>
			<div style="display:flex;gap:10px;margin-top:8px"><button type="submit" class="pg-btn"><i class="fas fa-floppy-disk"></i> Saqlash</button><button type="button" class="pg-btn ghost" data-open="t-courses">Bekor qilish</button></div>
		</form>
		<aside style="align-self:start;position:sticky;top:90px"><div class="pg-muted" style="margin-bottom:8px;font-weight:700">Ko'rinishi</div>
			<article class="pg-card pg-item"><div class="pg-cover" id="pvCover" style="background:var(--c1)"><span id="pvLetter">Y</span></div><span class="pg-pill" id="pvCat">Frontend</span><h3 style="margin-top:10px" id="pvTitle">Yangi kurs</h3><div class="pg-muted" id="pvDesc">Kurs tavsifi shu yerda ko'rinadi</div><div class="pg-meta"><span id="pvLessons">1 dars</span><b style="color:var(--ink)" id="pvPrice">200 000 so'm</b></div></article>
		</aside>
	</div>
</div>
