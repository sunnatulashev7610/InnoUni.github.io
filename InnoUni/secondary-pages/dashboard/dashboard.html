<!DOCTYPE html>
<html lang="uz">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gather Edu Dashboard</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
	
	<style>
		:root {
			--primary-color: #1fa97a;
			--secondary-color: #0f8a68;
			--accent-color: #f6b73c;
			--dark-bg: #0b1410;
			--sidebar-bg: #14231c;
			--card-bg: rgba(24, 40, 33, 0.9);
			--text-primary: #f1f5f9;
			--text-secondary: #94a3b8;
			--border-color: rgba(148, 163, 184, 0.1);
			--success-color: #10b981;
			--warning-color: #f59e0b;
			--danger-color: #ef4444;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
			background: linear-gradient(135deg, var(--dark-bg) 0%, #12231c 100%);
			color: var(--text-primary);
			min-height: 100vh;
			overflow-x: hidden;
		}

		/* HEADER */
		.header {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			height: 70px;
			background: rgba(11, 20, 16, 0.95);
			backdrop-filter: blur(20px);
			border-bottom: 1px solid var(--border-color);
			z-index: 1000;
			display: flex;
			align-items: center;
			padding: 0 30px;
		}

		.header-content {
			display: flex;
			justify-content: space-between;
			align-items: center;
			width: 100%;
		}

		.logo {
			font-size: 1.8rem;
			font-weight: 700;
			background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
			background-clip: text;
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.logo i {
			background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
			background-clip: text;
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
		}

		.header-actions {
			display: flex;
			align-items: center;
			gap: 20px;
		}

		.search-bar {
			position: relative;
			display: flex;
			align-items: center;
		}

		.search-bar input {
			background: var(--card-bg);
			border: 1px solid var(--border-color);
			border-radius: 12px;
			padding: 10px 40px 10px 15px;
			color: var(--text-primary);
			width: 300px;
			transition: all 0.3s ease;
		}

		.search-bar input:focus {
			outline: none;
			border-color: var(--primary-color);
			box-shadow: 0 0 0 3px rgba(31, 169, 122, 0.1);
		}

		.search-bar i {
			position: absolute;
			right: 15px;
			color: var(--text-secondary);
		}

		.user-menu {
			display: flex;
			align-items: center;
			gap: 15px;
		}

		.notification-btn {
			position: relative;
			background: var(--card-bg);
			border: 1px solid var(--border-color);
			border-radius: 12px;
			width: 45px;
			height: 45px;
			display: flex;
			align-items: center;
			justify-content: center;
			color: var(--text-secondary);
			cursor: pointer;
			transition: all 0.3s ease;
		}

		.notification-btn:hover {
			border-color: var(--primary-color);
			color: var(--primary-color);
		}

		.notification-badge {
			position: absolute;
			top: -5px;
			right: -5px;
			background: var(--danger-color);
			color: white;
			border-radius: 50%;
			width: 20px;
			height: 20px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 0.7rem;
			font-weight: 600;
		}

		.user-profile {
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 8px 15px;
			background: var(--card-bg);
			border: 1px solid var(--border-color);
			border-radius: 12px;
			cursor: pointer;
			transition: all 0.3s ease;
		}

		.user-profile:hover {
			border-color: var(--primary-color);
		}

		.user-avatar {
			width: 35px;
			height: 35px;
			border-radius: 50%;
			object-fit: cover;
		}

		.user-info {
			text-align: right;
		}

		.user-name {
			font-weight: 600;
			font-size: 0.9rem;
			color: var(--text-primary);
		}

		.user-role {
			font-size: 0.8rem;
			color: var(--text-secondary);
		}

		/* SIDEBAR */
		.sidebar {
			position: fixed;
			top: 70px;
			left: 0;
			width: 280px;
			height: calc(100vh - 70px);
			background: var(--sidebar-bg);
			padding: 30px 20px;
			overflow-y: auto;
			border-right: 1px solid var(--border-color);
		}

		.sidebar-section {
			margin-bottom: 30px;
		}

		.sidebar-title {
			font-size: 0.8rem;
			font-weight: 600;
			color: var(--text-secondary);
			text-transform: uppercase;
			letter-spacing: 0.05em;
			margin-bottom: 15px;
		}

		.nav-item {
			display: flex;
			align-items: center;
			padding: 12px 15px;
			margin-bottom: 5px;
			background: transparent;
			border: none;
			border-radius: 10px;
			color: var(--text-secondary);
			text-decoration: none;
			cursor: pointer;
			transition: all 0.3s ease;
			width: 100%;
			text-align: left;
			font-size: 0.95rem;
		}

		.nav-item:hover {
			background: rgba(31, 169, 122, 0.1);
			color: var(--text-primary);
			transform: translateX(5px);
		}

		.nav-item.active {
			background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
			color: white;
			box-shadow: 0 5px 15px rgba(31, 169, 122, 0.3);
		}

		.nav-item i {
			width: 20px;
			margin-right: 12px;
			font-size: 1.1rem;
		}

		.nav-badge {
			margin-left: auto;
			background: var(--danger-color);
			color: white;
			border-radius: 12px;
			padding: 2px 8px;
			font-size: 0.7rem;
			font-weight: 600;
		}

		/* MAIN CONTENT */
		.main {
			margin-left: 280px;
			margin-top: 70px;
			padding: 30px;
			min-height: calc(100vh - 70px);
		}

		.page-header {
			margin-bottom: 30px;
		}

		.page-title {
			font-size: 2rem;
			font-weight: 700;
			color: var(--text-primary);
			margin-bottom: 8px;
		}

		.page-subtitle {
			color: var(--text-secondary);
			font-size: 1rem;
		}

		/* STATS GRID */
		.stats-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
			gap: 25px;
			margin-bottom: 30px;
		}

		.stat-card {
			background: var(--card-bg);
			backdrop-filter: blur(20px);
			border: 1px solid var(--border-color);
			border-radius: 16px;
			padding: 25px;
			position: relative;
			overflow: hidden;
			transition: all 0.3s ease;
		}

		.stat-card::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			height: 3px;
			background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
		}

		.stat-card:hover {
			transform: translateY(-5px);
			box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
			border-color: var(--primary-color);
		}

		.stat-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 20px;
		}

		.stat-icon {
			width: 50px;
			height: 50px;
			border-radius: 12px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 1.3rem;
		}

		.stat-icon.primary {
			background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
			color: white;
		}

		.stat-icon.success {
			background: linear-gradient(135deg, var(--success-color), #059669);
			color: white;
		}

		.stat-icon.warning {
			background: linear-gradient(135deg, var(--warning-color), #d97706);
			color: white;
		}

		.stat-icon.danger {
			background: linear-gradient(135deg, var(--danger-color), #dc2626);
			color: white;
		}

		.stat-value {
			font-size: 2.2rem;
			font-weight: 700;
			color: var(--text-primary);
			margin-bottom: 5px;
		}

		.stat-label {
			color: var(--text-secondary);
			font-size: 0.9rem;
		}

		.stat-change {
			display: inline-flex;
			align-items: center;
			gap: 5px;
			font-size: 0.8rem;
			font-weight: 600;
			padding: 4px 8px;
			border-radius: 6px;
		}

		.stat-change.positive {
			color: var(--success-color);
			background: rgba(16, 185, 129, 0.1);
		}

		.stat-change.negative {
			color: var(--danger-color);
			background: rgba(239, 68, 68, 0.1);
		}

		/* CONTENT AREA */
		.content-area {
			background: var(--card-bg);
			backdrop-filter: blur(20px);
			border: 1px solid var(--border-color);
			border-radius: 16px;
			padding: 30px;
			min-height: 400px;
		}

		/* LOADING SPINNER */
		.loading {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 200px;
		}

		.spinner {
			width: 40px;
			height: 40px;
			border: 3px solid var(--border-color);
			border-top: 3px solid var(--primary-color);
			border-radius: 50%;
			animation: spin 1s linear infinite;
		}

		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}

		/* RESPONSIVE */
		@media (max-width: 1024px) {
			.sidebar {
				width: 250px;
			}
			.main {
				margin-left: 250px;
			}
		}

		@media (max-width: 768px) {
			.sidebar {
				transform: translateX(-100%);
				transition: transform 0.3s ease;
			}
			
			.sidebar.open {
				transform: translateX(0);
			}
			
			.main {
				margin-left: 0;
			}
			
			.search-bar input {
				width: 200px;
			}
		}

		@media (max-width: 576px) {
			.header {
				padding: 0 15px;
			}
			
			.search-bar {
				display: none;
			}
			
			.main {
				padding: 20px 15px;
			}
			
			.stats-grid {
				grid-template-columns: 1fr;
			}
		}
	</style>

</head>

	<script>
		// Enhanced loadPage function with loading states
		function loadPage(page, element) {
			// Update active state
			document.querySelectorAll(".nav-item")
				.forEach(btn => btn.classList.remove("active"));
			element.classList.add("active");

			// The welcome header and stat cards belong to the overview page only
			document.getElementById('mainOverview').hidden = page !== 't-home';

			// Show loading state
			const contentArea = document.getElementById("content");
			contentArea.innerHTML = `
				<div class="loading">
					<div class="spinner"></div>
				</div>
			`;

			// Load page content
			fetch("pages/" + page + ".html")
				.then(res => {
					if (!res.ok) {
						throw new Error('Page not found');
					}
					return res.text();
				})
				.then(data => {
					contentArea.innerHTML = data;
				})
				.catch(error => {
					console.error('Error loading page:', error);
					contentArea.innerHTML = `
						<div class="text-center py-5">
							<i class="fas fa-exclamation-triangle text-warning" style="font-size: 3rem;"></i>
							<h3 class="mt-3">Sahifa topilmadi</h3>
							<p class="text-secondary">Kechirasiz, bu sahifa mavjud emas</p>
						</div>
					`;
				});
		}

		// Initialize dashboard
		// ---- Role switch (student / teacher view) ----
		var currentRole = 'student';
		function initialRole() {
			var r = (location.search.match(/[?&]role=(student|teacher)/) || [])[1];
			try { r = r || localStorage.getItem('geRole'); } catch (e) { /* storage may be blocked */ }
			return r === 'teacher' ? 'teacher' : 'student';
		}
		function navFor(page) {
			return document.querySelector('[data-role-group="' + currentRole + '"] .nav-item[onclick*="\'' + page + '\'"]');
		}
		function setRole(role) {
			currentRole = role;
			document.body.dataset.role = role;
			document.getElementById('userRole').textContent = role === 'teacher' ? "O'qituvchi" : "O'quvchi";
			document.querySelectorAll('[data-role-btn]').forEach(function (b) { b.classList.toggle('on', b.dataset.roleBtn === role); });
			try { localStorage.setItem('geRole', role); } catch (e) { /* ignore */ }
			var home = role === 'teacher' ? 't-home' : 'main.dashboard';
			loadPage(home, navFor(home));
		}
		document.addEventListener('click', function (e) {
			var rb = e.target.closest('[data-role-btn]');
			if (rb) setRole(rb.dataset.roleBtn);
		});

		document.addEventListener('DOMContentLoaded', function() {
			// Load default page
			setRole(initialRole());
			
			// Add search functionality
			const searchInput = document.querySelector('.search-bar input');
			if (searchInput) {
				searchInput.addEventListener('input', function(e) {
					console.log('Searching for:', e.target.value);
					// Implement search functionality here
				});
			}

			// Add notification functionality
			const notificationBtn = document.querySelector('.notification-btn');
			if (notificationBtn) {
				notificationBtn.addEventListener('click', function() {
					console.log('Notifications clicked');
					// Implement notification panel here
				});
			}

			// Add user profile functionality
			const userProfile = document.querySelector('.user-profile');
			if (userProfile) {
				userProfile.addEventListener('click', function() {
					console.log('User profile clicked');
					// Implement user menu here
				});
			}
		});

		// Mobile menu toggle
		function toggleSidebar() {
			const sidebar = document.querySelector('.sidebar');
			sidebar.classList.toggle('open');
		}
	</script>
	<script>
		// Interactivity for the injected pages (scripts inside fetched fragments do not run, so we delegate from here)
		(function () {
			var content = document.getElementById('content');
			var replies = [
				"Yaxshi savol! Qisqacha: avval asosiy g'oyani tushunib oling, keyin kichik misolda sinab ko'ring.",
				'Mana mini test: 1) props nima? 2) state qachon o\'zgaradi? 3) useEffect nima uchun kerak?',
				"Vazifangizni ko'rib chiqdim: tuzilishi yaxshi, faqat o'zgaruvchi nomlarini aniqroq qiling."
			];
			function addMsg(box, text, cls, who) {
				var d = document.createElement('div');
				d.className = 'pg-msg ' + (cls || '');
				if (who) { var s = document.createElement('small'); s.textContent = who; d.appendChild(s); }
				d.appendChild(document.createTextNode(text)); // text only, never HTML
				box.appendChild(d);
				box.scrollTop = box.scrollHeight;
			}
			function send(chat, text) {
				var box = chat.querySelector('.pg-msgs');
				if (!text.trim()) return;
				addMsg(box, text, 'me', chat.dataset.chat === 'live' ? 'Siz' : '');
				if (chat.dataset.chat === 'ai') {
					setTimeout(function () { addMsg(box, replies[Math.floor(Math.random() * replies.length)], 'bot'); }, 600);
				}
			}
			content.addEventListener('submit', function (e) {
				var form = e.target.closest('.pg-send');
				if (!form) return;
				e.preventDefault();
				var input = form.querySelector('input');
				send(form.closest('[data-chat]'), input.value);
				input.value = '';
			});
			// ---- Pricing page: monthly/yearly switch and "choose plan" -> pre-filled order ----
			function openOrderWith(type, item, fmtIndex) {
				var btn = navFor(currentRole === 'teacher' ? 't-orders' : 'orders');
				loadPage('orders', btn);
				var tries = 0;
				var timer = setInterval(function () {
					var form = content.querySelector('#orderForm');
					if (form || ++tries > 40) {
						clearInterval(timer);
						if (!form) return;
						orderSetType(type);
						var sel = content.querySelector('#orderItem');
						Array.prototype.forEach.call(sel.options, function (o, k) { if (o.value === item) sel.selectedIndex = k; });
						content.querySelector('#orderFormat').selectedIndex = fmtIndex;
						orderUpdateTotal();
					}
				}, 50);
			}
			// ---- Orders page ----
			function money(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + " so'm"; }
			function catalog() { var el = content.querySelector('#orderCatalog'); return el ? JSON.parse(el.textContent) : null; }
			function orderUpdateTotal() {
				var sel = content.querySelector('#orderItem');
				var opt = sel && sel.options[sel.selectedIndex];
				if (!opt) return;
				var isTarif = content.querySelector('.pg-seg .on').dataset.orderType === 'tarif';
				var yearly = isTarif && content.querySelector('#orderFormat').selectedIndex === 1;
				content.querySelector('#orderTotal').textContent = money(yearly ? Math.round(opt.dataset.price * 12 * 0.8) : opt.dataset.price);
			}
			function orderSetType(type) {
				var cat = catalog(); if (!cat) return;
				var seg = content.querySelector('.pg-seg');
				seg.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.orderType === type); });
				var item = content.querySelector('#orderItem'), fmt = content.querySelector('#orderFormat');
				item.textContent = ''; fmt.textContent = '';
				cat[type].items.forEach(function (it) { var o = document.createElement('option'); o.value = it.n; o.textContent = it.n; o.dataset.price = it.p; item.appendChild(o); });
				cat[type].formats.forEach(function (f) { var o = document.createElement('option'); o.textContent = f; fmt.appendChild(o); });
				orderUpdateTotal();
			}
			content.addEventListener('change', function (e) { if (e.target.id === 'orderItem' || e.target.id === 'orderFormat') orderUpdateTotal(); });
			function toast(text) {
				var t = document.createElement('div'); t.className = 'pg-toast'; t.textContent = text;
				document.body.appendChild(t); setTimeout(function () { t.remove(); }, 3500);
			}
			content.addEventListener('submit', function (e) {
				if (e.target.id !== 'orderForm') return;
				e.preventDefault();
				var type = content.querySelector('.pg-seg .on').dataset.orderType;
				var sel = content.querySelector('#orderItem'), opt = sel.options[sel.selectedIndex];
				var list = content.querySelector('#pgFilterTarget');
				var id = 'GE-' + (1043 + list.children.length - 5);
				var row = document.createElement('div');
				row.className = 'pg-order new'; row.dataset.cat = type;
				var ic = document.createElement('div'); ic.className = 'ic';
				var look = { kurs: ['rgba(108,183,240,.2)', '#6cb7f0', 'fa-graduation-cap'], material: ['rgba(246,183,60,.2)', '#f6b73c', 'fa-book'], tarif: ['rgba(255,122,89,.2)', '#ff7a59', 'fa-crown'] }[type];
				ic.style.background = look[0]; ic.style.color = look[1];
				var i = document.createElement('i'); i.className = 'fas ' + look[2]; ic.appendChild(i);
				var mid = document.createElement('div'); mid.className = 'mid';
				var b = document.createElement('b'); b.textContent = opt.value;
				var sp = document.createElement('span'); sp.className = 'pg-muted';
				sp.textContent = id + ' \u00b7 ' + content.querySelector('#orderFormat').value + ' \u00b7 hozir';
				mid.appendChild(b); mid.appendChild(sp);
				var end = document.createElement('div'); end.className = 'end';
				var pr = document.createElement('b'); pr.textContent = content.querySelector('#orderTotal').textContent;
				var pill = document.createElement('span'); pill.className = 'pg-pill sun'; pill.textContent = 'Kutilmoqda';
				end.appendChild(pr); end.appendChild(pill);
				row.appendChild(ic); row.appendChild(mid); row.appendChild(end);
				list.insertBefore(row, list.firstChild); // text only, never HTML
				content.querySelector('#orderNote').value = '';
				toast('Buyurtma qabul qilindi: ' + id);
			});
			/* ---- Teacher pages (event delegation; all text via textContent) ---- */
			function q(sel) { return content.querySelector(sel); }
			function renumberLessons() {
				var rows = content.querySelectorAll('#lessonList .pg-lrow');
				rows.forEach(function (r, i) { r.querySelector('.n').textContent = (i < 9 ? '0' : '') + (i + 1); });
				var pv = q('#pvLessons'); if (pv) pv.textContent = rows.length + ' dars';
			}
			function courseSync() {
				if (!q('#cTitle')) return;
				var t = q('#cTitle').value.trim() || 'Nomsiz kurs';
				q('#pvTitle').textContent = t; q('#pvLetter').textContent = t.charAt(0).toUpperCase();
				q('#pvCat').textContent = q('#cCat').value;
				q('#pvDesc').textContent = q('#cDesc').value.trim() || 'Kurs tavsifi shu yerda ko\'rinadi';
				var pr = parseInt(q('#cPrice').value, 10) || 0;
				q('#pvPrice').textContent = pr ? money(pr) : 'Bepul';
			}
			function pendingCount() {
				var n = content.querySelectorAll('#subList .pg-sub[data-state="wait"]').length;
				var el = q('#gradePending'); if (el) el.textContent = n + ' ta kutilmoqda';
			}
			function pickSub(btn) {
				content.querySelectorAll('#subList .pg-sub').forEach(function (b) { b.classList.toggle('on', b === btn); });
				q('#gdCourse').textContent = btn.dataset.course; q('#gdTask').textContent = btn.dataset.task;
				q('#gdStudent').textContent = btn.dataset.student; q('#gdAnswer').textContent = btn.dataset.answer.replace(/\\n/g, '\n');
				q('#gradeForm').dataset.current = btn.dataset.task;
			}
			function recount() {
				['wait', 'ok', 'bad'].forEach(function (k) {
					var el = q('#ord' + { wait: 'Wait', ok: 'Ok', bad: 'Bad' }[k]);
					if (el) el.textContent = content.querySelectorAll('.pg-order[data-state="' + k + '"]').length;
				});
			}
			content.addEventListener('click', function (e) {
				var a = e.target.closest('[data-action]');
				if (a && a.dataset.action === 'add-lesson') {
					var list = q('#lessonList'); if (!list) return;
					var row = document.createElement('div'); row.className = 'pg-lrow';
					var n = document.createElement('span'); n.className = 'n';
					var inp = document.createElement('input'); inp.className = 'pg-input'; inp.placeholder = 'Dars nomi';
					var x = document.createElement('button'); x.type = 'button'; x.className = 'pg-x'; x.dataset.action = 'del-lesson'; x.setAttribute('aria-label', 'O\'chirish');
					var xi = document.createElement('i'); xi.className = 'fas fa-xmark'; x.appendChild(xi);
					row.appendChild(n); row.appendChild(inp); row.appendChild(x); list.appendChild(row);
					renumberLessons(); inp.focus(); return;
				}
				if (a && a.dataset.action === 'del-lesson') { a.closest('.pg-lrow').remove(); renumberLessons(); return; }
				if (a && a.dataset.action === 'skip-sub') {
					var subs = Array.prototype.slice.call(content.querySelectorAll('#subList .pg-sub[data-state="wait"]'));
					var cur = q('#subList .pg-sub.on'); var i = subs.indexOf(cur);
					if (subs.length) pickSub(subs[(i + 1) % subs.length]); return;
				}
				var cov = e.target.closest('#cCover i[data-cover]');
				if (cov) { var pc = q('#pvCover'); if (pc) pc.style.background = cov.dataset.cover; return; }
				var sub = e.target.closest('.pg-sub');
				if (sub) { pickSub(sub); return; }
				var qs = e.target.closest('#quickScores [data-score]');
				if (qs) { q('#gScore').value = qs.dataset.score; return; }
				var oa = e.target.closest('[data-order-act]');
				if (oa) {
					var row = oa.closest('.pg-order'), ok = oa.dataset.orderAct === 'ok';
					row.dataset.state = row.dataset.cat = ok ? 'ok' : 'bad';
					var st = row.querySelector('.state'); st.textContent = '';
					var pill = document.createElement('span'); pill.className = 'pg-pill' + (ok ? '' : ' coral'); pill.textContent = ok ? 'Tasdiqlangan' : 'Rad etilgan';
					st.appendChild(pill); row.querySelector('.acts').textContent = '';
					recount(); toast(ok ? 'Buyurtma tasdiqlandi' : 'Buyurtma rad etildi');
				}
			});
			content.addEventListener('input', function (e) {
				if (e.target.closest('#courseForm')) courseSync();
				var s = e.target.closest('[data-search]');
				if (s) {
					var term = s.value.trim().toLowerCase(), shown = 0;
					content.querySelectorAll('#' + s.dataset.search + ' tr').forEach(function (tr) {
						var hit = tr.textContent.toLowerCase().indexOf(term) !== -1; tr.hidden = !hit; if (hit) shown++;
					});
					var em = q('#studentEmpty'); if (em) em.hidden = shown > 0;
				}
			});
			content.addEventListener('change', function (e) { if (e.target.closest('#courseForm')) courseSync(); });
			content.addEventListener('submit', function (e) {
				if (e.target.id === 'courseForm') {
					e.preventDefault();
					toast(q('#cPublish').checked ? 'Kurs nashr etildi' : 'Qoralama saqlandi');
				} else if (e.target.id === 'gradeForm') {
					e.preventDefault();
					var on = q('#subList .pg-sub.on'); if (!on) return;
					var sc = Math.max(0, Math.min(100, parseInt(q('#gScore').value, 10) || 0));
					on.dataset.state = 'done';
					var pill = on.querySelector('.pg-pill'); pill.className = 'pg-pill'; pill.textContent = sc + ' / 100';
					pendingCount(); toast(on.dataset.student + ': ' + sc + ' ball qo\'yildi');
					q('#gNote').value = '';
					var nxt = q('#subList .pg-sub[data-state="wait"]'); if (nxt) pickSub(nxt);
				} else if (e.target.id === 'lessonForm') {
					e.preventDefault();
					var card = document.createElement('div'); card.className = 'pg-card pg-file';
					var wh = document.createElement('div'); wh.className = 'pg-when';
					var wb = document.createElement('b'); wb.textContent = q('#lTime').value; var ws = document.createElement('span'); ws.textContent = q('#lDay').value;
					wh.appendChild(wb); wh.appendChild(ws);
					var mid = document.createElement('div'); mid.style.cssText = 'flex:1;min-width:0';
					var t = document.createElement('b'); t.textContent = q('#lTitle').value;
					var c = document.createElement('div'); c.className = 'pg-muted'; c.textContent = q('#lCourse').value;
					mid.appendChild(t); mid.appendChild(c);
					var tag = document.createElement('span'); tag.className = 'pg-pill sun'; tag.textContent = 'Rejada';
					card.appendChild(wh); card.appendChild(mid); card.appendChild(tag);
					q('#lessonCards').appendChild(card); q('#lTitle').value = '';
					toast('Jonli dars rejalashtirildi');
				}
			});
			content.addEventListener('click', function (e) {
				var chip = e.target.closest('.pg-chip');
				if (chip) {
					var cat = chip.dataset.cat;
					chip.parentNode.querySelectorAll('.pg-chip').forEach(function (c) { c.classList.toggle('on', c === chip); });
					content.querySelectorAll('#pgFilterTarget > [data-cat]').forEach(function (it) { it.hidden = !(cat === 'all' || it.dataset.cat === cat); });
					return;
				}
				var sug = e.target.closest('.pg-sug button');
				if (sug) { var chat = content.querySelector('[data-chat="ai"]'); if (chat) send(chat, sug.textContent); return; }
				var sw = e.target.closest('.pg-swatches i');
				if (sw) { sw.parentNode.querySelectorAll('i').forEach(function (i) { i.classList.toggle('on', i === sw); }); return; }
				var open = e.target.closest('[data-open]');
				if (open && !e.target.closest('.btn-join')) {
					// detail pages keep their parent's sidebar item highlighted
					var nav = { 'course-detail': 'courses', 'group-detail': 'groups' }[open.dataset.open] || open.dataset.open;
					var btn = navFor(nav);
					loadPage(open.dataset.open, btn || document.querySelector('.nav-item.active'));
					document.querySelector('.main').scrollTop = 0; window.scrollTo(0, 0);
					return;
				}
				var tab = e.target.closest('[data-tab]');
				if (tab) {
					tab.parentNode.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b === tab); });
					content.querySelectorAll('.pg-pane').forEach(function (p) { p.hidden = p.id !== tab.dataset.tab; });
					return;
				}
				if (e.target.closest('[data-action="print-cert"]')) { window.print(); return; }
				var bill = e.target.closest('[data-billing]');
				if (bill) {
					var yearly = bill.dataset.billing === '1';
					bill.parentNode.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b === bill); });
					content.querySelectorAll('#pricingPlans .amt').forEach(function (a) { var m = Number(a.dataset.m); a.textContent = money(yearly ? Math.round(m * 0.8) : m).replace(" so'm", ''); });
					content.querySelectorAll('#pricingPlans .pg-plan-btn[data-order-preset]').forEach(function (b) { var p = b.dataset.orderPreset.split('|'); p[2] = yearly ? '1' : '0'; b.dataset.orderPreset = p.join('|'); });
					return;
				}
				var preset = e.target.closest('[data-order-preset]');
				if (preset) { var pp = preset.dataset.orderPreset.split('|'); openOrderWith(pp[0], pp[1], Number(pp[2])); return; }
				var ot = e.target.closest('[data-order-type]');
				if (ot) { orderSetType(ot.dataset.orderType); return; }
				if (e.target.closest('[data-action="focus-order"]')) { var f = content.querySelector('#orderForm'); if (f) { f.scrollIntoView({ behavior: 'smooth', block: 'center' }); content.querySelector('#orderItem').focus(); } return; }
				var hand = e.target.closest('[data-action="raise-hand"]');
				if (hand) hand.classList.toggle('on');
			});
		})();
	</script>
