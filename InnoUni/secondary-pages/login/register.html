<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
	<meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish - Gather Edu</title>
        <script>(function(){var t=null;try{t=localStorage.getItem('geTheme')}catch(e){}document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')})()</script>
        <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400..700&display=swap">
        <link rel="stylesheet" href="../../style/theme.css">
        <link rel="stylesheet" href="../../style/gather.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="icon" type="image/png" sizes="32x32" href="../../imgs/logo/favicon-32.png">
	<link rel="apple-touch-icon" href="../../imgs/logo/apple-touch-icon.png">
<link rel="stylesheet" href="../../style/consent.css">
</head>

<body class="ge ge-auth">
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Tungi rejimga o'tish" aria-pressed="false"><i class="fas fa-sun ico-sun"></i><i class="fas fa-moon ico-moon"></i></button>
    <a href="../../index.html" class="back-link">
        <i class="fas fa-arrow-left me-2"></i>Asosiy sahifa
    </a>

    <div class="register-container">
        <div class="register-header">
            <div class="logo"><img class="logo-img" src="../../imgs/logo/logo-icon.png" width="36" height="36" alt="">Gather Edu</div>
            <h1 class="register-title">Ro'yxatdan o'tish</h1>
            <p class="register-subtitle">Gather Edu'ga qo'shiling</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form id="registerForm">
            <div class="role-selector">
                <div class="role-option" data-role="student">
                    <div class="role-icon">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <div class="role-title">O'quvchi</div>
                    <div class="role-desc">Kurslarda o'qish</div>
                </div>
                <div class="role-option" data-role="teacher">
                    <div class="role-icon">
                        <i class="fas fa-chalkboard-teacher"></i>
                    </div>
                    <div class="role-title">O'qituvchi</div>
                    <div class="role-desc">Kurslarni boshqarish</div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="full_name" class="form-label">To'liq ism</label>
                    <input type="text" id="full_name" class="form-control" placeholder="Ismingiz" required>
                </div>
                <div class="form-group">
                    <label for="phone" class="form-label">Telefon raqam</label>
                    <input type="tel" id="phone" class="form-control" placeholder="+998 XX XXX-XX-XX">
                </div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email manzil</label>
                <input type="email" id="email" class="form-control" placeholder="email@example.com" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Parol</label>
                <input type="password" id="password" class="form-control" placeholder="Kamida 8 ta belgi" required>
                <div class="password-requirements">
                    Kamida 8 ta belgi, katta va kichik harflar
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Parolni tasdiqlash</label>
                <input type="password" id="confirm_password" class="form-control" placeholder="Parolni qayta kiriting" required>
            </div>

            <button type="submit" class="register-btn" id="registerBtn">
                <span id="btnText">Ro'yxatdan o'tish</span>
            </button>
        </form>

        <div class="divider">
            <span>yoki</span>
        </div>

        <div class="login-link">
            <p>Allaqachon ro'yxatdan o'tganmisiz?</p>
            <a href="login.html">Tizimga kirish</a>
        </div>
    </div>

    <script src="../../frontend/js/utils.js"></script>
    <script src="../../frontend/js/config.js"></script>
    <script>
        // Role selection
        let selectedRole = 'student';
        
        document.querySelectorAll('.role-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.role-option').forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
                selectedRole = this.dataset.role;
            });
        });

        // Set default selection
        document.querySelector('[data-role="student"]').classList.add('selected');

        // Form submission
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('full_name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const registerBtn = document.getElementById('registerBtn');
            const btnText = document.getElementById('btnText');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            // Validation
            if (!fullName || !email || !password || !confirmPassword) {
                showError('Barcha majburiy maydonlarni to\'ldiring');
                return;
            }

            // Name validation
            if (fullName.length < 2) {
                showError('Ism kamida 2 ta belgidan iborat bo\'lishi kerak');
                return;
            }

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('Iltimos, to\'gri email manzilini kiriting');
                return;
            }

            // Password validation
            if (password.length < 8) {
                showError('Parol kamida 8 ta belgidan iborat bo\'lishi kerak');
                return;
            }

            if (password !== confirmPassword) {
                showError('Parollar mos kelmadi');
                return;
            }

            // Password strength validation
            const hasUpperCase = /[A-Z]/.test(password);
            const hasLowerCase = /[a-z]/.test(password);
            const hasNumbers = /\d/.test(password);
            
            if (!hasUpperCase || !hasLowerCase || !hasNumbers) {
                showError('Parolda kamida bitta katta harf, bitta kichik harf va bitta raqam bo\'lishi kerak');
                return;
            }

            // Show loading state
            registerBtn.disabled = true;
            btnText.textContent = 'Ro\'yxatdan o\'tish...';
            registerBtn.classList.add('loading');
            hideMessages();

            try {
                // API address: local server while developing, same origin otherwise
                const API_BASE = (window.config && window.config.apiBaseUrl) ||
                    (['localhost', '127.0.0.1'].includes(window.location.hostname) ? 'http://localhost:3000/api' : '/api');

                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        full_name: fullName,
                        email: email,
                        phone: phone,
                        password: password,
                        role: selectedRole
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Show success message
                    showSuccess('Muvaffaqiyatli ro\'yxatdan o\'tish!');

                    // Auto-login after successful registration
                    setTimeout(async () => {
                        try {
                            const loginResponse = await fetch(`${API_BASE}/auth/login`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                },
                                body: JSON.stringify({
                                    email: email,
                                    password: password,
                                    role: selectedRole
                                })
                            });

                            const loginData = await loginResponse.json();

                            if (loginResponse.ok) {
                                // Store token and user info
                                localStorage.setItem('token', loginData.token);
                                localStorage.setItem('user', JSON.stringify(loginData.user));
                                localStorage.setItem('userRole', loginData.user.role);

                                // Redirect based on role
                                window.location.href = siteUrl(loginData.user.role === 'admin' ? 'secondary-pages/admin/admin.html' : 'secondary-pages/dashboard/dashboard.html');
                            } else {
                                showError('Avto-login xatolik. Iltimos, qo\'lda kirish.');
                            }
                        } catch (error) {
                            console.error('Auto-login error:', error);
                            showError('Avto-login xatolik. Iltimos, qo\'lda kirish.');
                        }
                    }, 2000);
                } else {
                    showError(data.error || 'Ro\'yxatdan o\'tishda xatolik yuz berdi');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showError(window.config && window.config.backendMissing ? 'Server ulanmagan: GitHub Pages faqat statik sahifalarni ko\'rsatadi. frontend/js/config.js ichida BACKEND_API_URL ni kiriting.' : 'Tarmoq xatoligi. Iltimos, qayta urinib ko\'ring.');
            } finally {
                // Reset button state
                registerBtn.disabled = false;
                btnText.textContent = 'Ro\'yxatdan o\'tish';
                registerBtn.classList.remove('loading');
            }
        });

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
        }

        function showSuccess(message) {
            const successElement = document.getElementById('successMessage');
            successElement.textContent = message;
            successElement.style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
        }

        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        // Enter key support for role selection
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                const roles = ['student', 'teacher'];
                const currentIndex = roles.indexOf(selectedRole);
                let newIndex;
                
                if (e.key === 'ArrowLeft') {
                    newIndex = currentIndex > 0 ? currentIndex - 1 : roles.length - 1;
                } else {
                    newIndex = currentIndex < roles.length - 1 ? currentIndex + 1 : 0;
                }
                
                selectedRole = roles[newIndex];
                document.querySelectorAll('.role-option').forEach(opt => opt.classList.remove('selected'));
                document.querySelector(`[data-role="${selectedRole}"]`).classList.add('selected');
            }
        });

        // Auto-focus name field on load
        window.addEventListener('load', function() {
            document.getElementById('full_name').focus();
        });

        // Real-time password validation
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            if (confirmPassword && password !== confirmPassword) {
                document.getElementById('confirm_password').style.borderColor = '#dc3545';
            } else if (confirmPassword && password === confirmPassword) {
                document.getElementById('confirm_password').style.borderColor = '#28a745';
            } else {
                document.getElementById('confirm_password').style.borderColor = 'rgba(255, 255, 255, 0.2)';
            }
        });

        document.getElementById('confirm_password').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            
            if (password && confirmPassword && password !== confirmPassword) {
                this.style.borderColor = '#dc3545';
            } else if (password && confirmPassword && password === confirmPassword) {
                this.style.borderColor = '#28a745';
            } else {
                this.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            }
        });
    </script>
    <script src="../../frontend/js/theme.js"></script>
<script src="../../frontend/js/consent.js"></script>
</body>

</html>
