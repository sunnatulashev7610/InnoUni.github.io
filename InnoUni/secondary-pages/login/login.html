<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
	<meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish - Gather Edu</title>
        <script>(function(){var t=null;try{t=localStorage.getItem('geTheme')}catch(e){}document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')})()</script>
        <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400..700&display=swap">
        <link rel="stylesheet" href="../../style/theme.css">
        <link rel="stylesheet" href="../../style/gather.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="icon" type="image/png" sizes="32x32" href="../../imgs/logo/favicon-32.png">
	<link rel="apple-touch-icon" href="../../imgs/logo/apple-touch-icon.png">
<link rel="stylesheet" href="../../style/consent.css">
</head>

<body class="ge ge-auth">
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Tungi rejimga o'tish" aria-pressed="false"><i class="fas fa-sun ico-sun"></i><i class="fas fa-moon ico-moon"></i></button>
    <a href="../../index.html" class="back-link">
        <i class="fas fa-arrow-left me-2"></i>Asosiy sahifa
    </a>

    <div class="login-container">
        <div class="login-header">
            <div class="logo"><img class="logo-img" src="../../imgs/logo/logo-icon.png" width="36" height="36" alt="">Gather Edu</div>
            <h1 class="login-title">Tizimga kirish</h1>
            <p class="login-subtitle">Gather Edu platformasiga xush kelibsiz</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form id="loginForm">
            <div class="role-selector">
                <div class="role-option" data-role="student">
                    <div class="role-icon">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <div class="role-title">O'quvchi</div>
                    <div class="role-desc">Kurslarda o'qish</div>
                </div>
                <div class="role-option" data-role="teacher">
                    <div class="role-icon">
                        <i class="fas fa-chalkboard-teacher"></i>
                    </div>
                    <div class="role-title">O'qituvchi</div>
                    <div class="role-desc">Kurslarni boshqarish</div>
                </div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email manzil</label>
                <input type="email" id="email" class="form-control" placeholder="email@example.com" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Parol</label>
                <input type="password" id="password" class="form-control" placeholder="Parolingizni kiriting" required>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span id="btnText">Kirish</span>
            </button>
        </form>

        <div class="divider">
            <span>yoki</span>
        </div>

        <div class="register-link">
            <p>Hali ro'yxatdan o'tmaganmisiz?</p>
            <a href="register.html">Ro'yxatdan o'tish</a>
        </div>
    </div>

    <script src="../../frontend/js/utils.js"></script>
    <script src="../../frontend/js/config.js"></script>
    <script src="../../frontend/js/api.js"></script>
    <script>
        // Role selection
        let selectedRole = 'student';
        
        document.querySelectorAll('.role-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.role-option').forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
                selectedRole = this.dataset.role;
            });
        });

        // Set default selection
        document.querySelector('[data-role="student"]').classList.add('selected');

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            // Validation
            if (!email || !password) {
                showError('Barcha maydonlarni to\'ldiring');
                return;
            }

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('Iltimos, to\'gri email manzilini kiriting');
                return;
            }

            // Show loading state
            loginBtn.disabled = true;
            btnText.textContent = 'Kirish...';
            loginBtn.classList.add('loading');
            hideMessages();

            try {
                // Same API address logic as frontend/js/api.js: local server while developing, same origin otherwise
                const API_BASE = (window.config && window.config.apiBaseUrl) ||
                    (['localhost', '127.0.0.1'].includes(window.location.hostname) ? 'http://localhost:3000/api' : '/api');

                // Login with role
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        role: selectedRole
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Store token and user info
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('userRole', data.user.role);

                    // Show success message
                    showSuccess('Muvaffaqiyatli kirish!');

                    // Redirect based on role
                    setTimeout(() => {
                        window.location.href = siteUrl(data.user.role === 'teacher' ? 'frontend/teacher.html' : 'frontend/student.html');
                    }, 1500);
                } else {
                    showError(data.error || 'Kirishda xatolik yuz berdi');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError(window.config && window.config.backendMissing ? 'Server ulanmagan: GitHub Pages faqat statik sahifalarni ko\'rsatadi. frontend/js/config.js ichida BACKEND_API_URL ni kiriting.' : 'Tarmoq xatoligi. Iltimos, qayta urinib ko\'ring.');
            } finally {
                // Reset button state
                loginBtn.disabled = false;
                btnText.textContent = 'Kirish';
                loginBtn.classList.remove('loading');
            }
        });

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
        }

        function showSuccess(message) {
            const successElement = document.getElementById('successMessage');
            successElement.textContent = message;
            successElement.style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
        }

        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        // Enter key support for role selection
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                const roles = ['student', 'teacher'];
                const currentIndex = roles.indexOf(selectedRole);
                let newIndex;
                
                if (e.key === 'ArrowLeft') {
                    newIndex = currentIndex > 0 ? currentIndex - 1 : roles.length - 1;
                } else {
                    newIndex = currentIndex < roles.length - 1 ? currentIndex + 1 : 0;
                }
                
                selectedRole = roles[newIndex];
                document.querySelectorAll('.role-option').forEach(opt => opt.classList.remove('selected'));
                document.querySelector(`[data-role="${selectedRole}"]`).classList.add('selected');
            }
        });

        // Auto-focus email field on load
        window.addEventListener('load', function() {
            document.getElementById('email').focus();
        });
    </script>
    <script src="../../frontend/js/theme.js"></script>
<script src="../../frontend/js/consent.js"></script>
</body>

</html>
