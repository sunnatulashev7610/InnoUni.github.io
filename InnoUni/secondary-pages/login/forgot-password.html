<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
	<meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parolni tiklash - Gather Edu</title>
        <script>(function(){var d=document.documentElement,p='dark';try{p=localStorage.getItem('geTheme')||'dark'}catch(e){}if(p!=='light'&&p!=='system')p='dark';d.dataset.themePref=p;d.dataset.theme=p==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):p})()</script>
        <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400..700&display=swap">
        <link rel="stylesheet" href="../../style/theme.css">
        <link rel="stylesheet" href="../../style/gather.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="icon" type="image/png" sizes="32x32" href="../../imgs/logo/favicon-32.png">
	<link rel="apple-touch-icon" href="../../imgs/logo/apple-touch-icon.png">
<link rel="stylesheet" href="../../style/consent.css">
</head>

<body class="ge ge-auth">
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Tungi rejimga o'tish" aria-pressed="false"><i class="fas fa-sun ico-sun"></i><i class="fas fa-moon ico-moon"></i></button>
    <a href="login.html" class="back-link"><i class="fas fa-arrow-left me-2"></i>Kirish sahifasi</a>

    <div class="login-container">
        <div class="login-header">
            <div class="logo"><img class="logo-img" src="../../imgs/logo/logo-icon.png" width="36" height="36" alt="">Gather Edu</div>
            <h1 class="login-title">Parolni tiklash</h1>
            <p class="login-subtitle" id="subtitle">Emailingizni kiriting, tiklash havolasini yuboramiz</p>
        </div>
        <div class="error-message" id="errorMessage" role="alert"></div>
        <div class="success-message" id="successMessage" role="status"></div>

        <form id="f">
            <div class="form-group">
                <label for="email" class="form-label">Email manzil</label>
                <input type="email" id="email" class="form-control" placeholder="email@example.com" required autocomplete="email">
            </div>
            <button type="submit" class="login-btn" id="btn"><span>Havola yuborish</span></button>
        </form>
    </div>

    <script src="../../frontend/js/utils.js"></script>
    <script src="../../frontend/js/config.js"></script>
    <script>
        var API_BASE = (window.config && window.config.apiBaseUrl) ||
            (['localhost', '127.0.0.1'].includes(window.location.hostname) ? 'http://localhost:3000/api' : '/api');
        function show(id, text) { var e = document.getElementById(id); e.textContent = text; e.style.display = 'block'; document.getElementById(id === 'errorMessage' ? 'successMessage' : 'errorMessage').style.display = 'none'; }
        async function post(path, body) {
            var res = await fetch(API_BASE + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            var data = {}; try { data = await res.json(); } catch (e) {}
            return { ok: res.ok, status: res.status, data: data };
        }
        var token = new URLSearchParams(location.search).get('token') || '';

        document.getElementById('f').addEventListener('submit', async function (e) {
            e.preventDefault();
            var btn = document.getElementById('btn'); btn.disabled = true;
            try {
                var r = await post('/auth/forgot-password', { email: document.getElementById('email').value.trim() });
                if (r.ok) show('successMessage', "Agar bu email ro'yxatdan o'tgan bo'lsa, tiklash havolasi yuborildi. Pochtangizni (va spam papkasini) tekshiring.");
                else if (r.status === 503) show('errorMessage', "Email yuborish hozircha ulanmagan. Iltimos, administrator bilan bog'laning.");
                else if (r.status === 429) show('errorMessage', "Juda ko'p urinish. Birozdan keyin qayta urinib ko'ring.");
                else show('errorMessage', r.data.error === 'Valid email is required' ? "Iltimos, to'g'ri email kiriting" : "Xatolik yuz berdi. Qayta urinib ko'ring.");
            } catch (err) { show('errorMessage', "Tarmoq xatoligi. Qayta urinib ko'ring."); }
            btn.disabled = false;
        });
    </script>
    <script src="../../frontend/js/theme.js"></script>
<script src="../../frontend/js/consent.js"></script>
</body>

</html>
