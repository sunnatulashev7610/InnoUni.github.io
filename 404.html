	<style>
		/* Self-contained on purpose: this page is served at ANY url depth, so it cannot use relative asset paths. */
		:root, :root[data-theme="light"] { --bg: #f4f5f8; --surface: #fff; --ink: #131722; --ink-2: #545d6e; --line: #e1e5ee; --brand: #2b59e8; --on-brand: #fff; --dot: #d6dbe6; --c1: #3d5be0; --c5: #7648d6; --c3: #0e8a9e; }
		:root[data-theme="dark"] { --bg: #0d1020; --surface: #151930; --ink: #e6e8f5; --ink-2: #a0a8c8; --line: #262c4f; --brand: #8b7dff; --on-brand: #0d1020; --dot: #20264a; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 22px 22px; color: var(--ink); font-family: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6; }
		main { width: min(560px, 100%); text-align: center; }
		.logo { display: inline-flex; align-items: center; gap: 10px; font: 800 22px "Bricolage Grotesque", "Onest", sans-serif; letter-spacing: -.03em; color: var(--ink); text-decoration: none; }
		.logo img { width: 36px; height: 36px; border-radius: 10px; }
		.num { display: flex; justify-content: center; align-items: center; gap: clamp(6px, 2vw, 16px); margin: 34px 0 6px; font: 800 clamp(96px, 26vw, 180px) / 1 "Bricolage Grotesque", "Onest", sans-serif; letter-spacing: -.06em; }
		.num span { color: var(--ink); }
		.num .orb { width: .78em; height: .78em; border-radius: 50%; background: var(--brand); position: relative; }
		.num .orb::after { content: ""; position: absolute; left: 50%; top: 50%; width: .3em; height: .3em; transform: translate(-50%, -50%); border-radius: 50%; background: var(--bg); }
		h1 { font: 800 clamp(26px, 5vw, 36px) / 1.15 "Bricolage Grotesque", "Onest", sans-serif; letter-spacing: -.02em; margin: 0 0 12px; }
		p { margin: 0 auto; max-width: 42ch; color: var(--ink-2); font-size: 18px; }
		.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; }
		.btn { display: inline-flex; align-items: center; padding: 14px 26px; border-radius: 12px; border: 1px solid var(--line); font: 700 16px/1 "Onest", sans-serif; text-decoration: none; color: var(--ink); transition: transform .18s; }
		.btn:hover { border-color: var(--brand); }
		.btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
		.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
		.links { margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--line); font-size: 15px; color: var(--ink-2); }
		.links a { color: var(--brand); font-weight: 700; text-decoration: none; margin: 0 8px; }
		.links a:hover { text-decoration: underline; }
		.path { display: inline-block; max-width: 100%; overflow-wrap: anywhere; margin-top: 18px; padding: 6px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font: 500 13px ui-monospace, monospace; color: var(--ink-2); }
		@media (prefers-reduced-motion: reduce) { .orb { animation: none !important; } }
	</style>
