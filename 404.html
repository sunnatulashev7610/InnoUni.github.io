<!DOCTYPE html>
<html lang="uz">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex">
	<title>Sahifa topilmadi · Gather Edu</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='14' cy='15' r='10' fill='%232b59e8'/%3E%3Ccircle cx='27' cy='15' r='10' fill='%238b7dff'/%3E%3Ccircle cx='20.5' cy='27' r='10' fill='%230e8a9e'/%3E%3C/svg%3E">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400..700&display=swap">
	<script>(function(){var t=null;try{t=localStorage.getItem('geTheme')}catch(e){}document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')})()</script>
	<style>
		/* Self-contained on purpose: this page is served at ANY url depth, so it cannot use relative asset paths. */
		:root, :root[data-theme="light"] { --bg: #f4f5f8; --surface: #fff; --ink: #131722; --ink-2: #545d6e; --line: #e1e5ee; --brand: #2b59e8; --on-brand: #fff; --dot: #d6dbe6; --c1: #3d5be0; --c5: #7648d6; --c3: #0e8a9e; }
		:root[data-theme="dark"] { --bg: #0d1020; --surface: #151930; --ink: #e6e8f5; --ink-2: #a0a8c8; --line: #262c4f; --brand: #8b7dff; --on-brand: #0d1020; --dot: #20264a; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 22px 22px; color: var(--ink); font-family: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6; }
		main { width: min(560px, 100%); text-align: center; }
		.logo { display: inline-flex; align-items: center; gap: 10px; font: 800 22px "Bricolage Grotesque", "Onest", sans-serif; letter-spacing: -.03em; color: var(--ink); text-decoration: none; }
		.logo svg { width: 36px; height: 36px; }
		.num { display: flex; justify-content: center; align-items: center; gap: clamp(6px, 2vw, 16px); margin: 34px 0 6px; font: 800 clamp(96px, 26vw, 180px) / 1 "Bricolage Grotesque", "Onest", sans-serif; letter-spacing: -.06em; }
		.num span { color: var(--ink); }
		.num .orb { width: .78em; height: .78em; border-radius: 50%; background: var(--brand); position: relative; }
		.num .orb::after { content: ""; position: absolute; left: 50%; top: 50%; width: .3em; height: .3em; transform: translate(-50%, -50%); border-radius: 50%; background: var(--bg); }
		h1 { font: 800 clamp(26px, 5vw, 36px) / 1.15 "Bricolage Grotesque", "Onest", sans-serif; letter-spacing: -.02em; margin: 0 0 12px; }
		p { margin: 0 auto; max-width: 42ch; color: var(--ink-2); font-size: 18px; }
		.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; }
		.btn { display: inline-flex; align-items: center; padding: 14px 26px; border-radius: 12px; border: 1px solid var(--line); font: 700 16px/1 "Onest", sans-serif; text-decoration: none; color: var(--ink); transition: transform .18s; }
		.btn:hover { border-color: var(--brand); }
		.btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
		.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
		.links { margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--line); font-size: 15px; color: var(--ink-2); }
		.links a { color: var(--brand); font-weight: 700; text-decoration: none; margin: 0 8px; }
		.links a:hover { text-decoration: underline; }
		.path { display: inline-block; max-width: 100%; overflow-wrap: anywhere; margin-top: 18px; padding: 6px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font: 500 13px ui-monospace, monospace; color: var(--ink-2); }
		@media (prefers-reduced-motion: reduce) { .orb { animation: none !important; } }
	</style>
</head>

<body>
	<main>
		<a class="logo" data-go="" href="./"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="14" cy="15" r="10" style="fill:var(--c1)"/><circle cx="27" cy="15" r="10" style="fill:var(--c5)" fill-opacity=".92"/><circle cx="20.5" cy="27" r="10" style="fill:var(--c3)" fill-opacity=".92"/></svg>Gather Edu</a>
		<div class="num" aria-hidden="true"><span>4</span><span class="orb"></span><span>4</span></div>
		<h1>Bu sahifa topilmadi</h1>
		<p>Havola eskirgan yoki manzilda xato bo'lishi mumkin. Keling, sizni to'g'ri joyga qaytaramiz.</p>
		<div class="actions">
			<a class="btn primary" data-go="index.html" href="InnoUni/index.html">Bosh sahifaga qaytish</a>
			<a class="btn" data-go="secondary-pages/login/login.html" href="InnoUni/secondary-pages/login/login.html">Kirish</a>
		</div>
		<div class="links">Foydali havolalar:
			<a data-go="index.html#imkoniyatlar" href="InnoUni/index.html#imkoniyatlar">Imkoniyatlar</a>
			<a data-go="index.html#guruhlar" href="InnoUni/index.html#guruhlar">Guruhlar</a>
			<a data-go="index.html#contact" href="InnoUni/index.html#contact">Aloqa</a>
		</div>
		<code class="path" id="path" hidden></code>
	</main>
	<script>
		// A 404 page can be shown at any depth (/a/b/c), so build links from the site root instead of relative paths.
		// GitHub Pages project site: https://user.github.io/<repo>/...
		(function () {
			var parts = location.pathname.split('/').filter(Boolean);
			// the app lives in the InnoUni/ folder on GitHub Pages, and at the web root when served by Express
			var root = /\.github\.io$/.test(location.hostname) && parts.length ? '/' + parts[0] + '/InnoUni/' : '/';
			document.querySelectorAll('[data-go]').forEach(function (a) { a.setAttribute('href', root + a.getAttribute('data-go')); });
			var p = document.getElementById('path');
			p.textContent = location.pathname; // text only
			p.hidden = false;
		})();
	</script>
</body>

</html>
