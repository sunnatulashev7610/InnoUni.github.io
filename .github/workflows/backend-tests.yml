name: Backend tests

on:
  push:
    branches: [main]
    paths: ['InnoUni/backend/**', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['InnoUni/backend/**', '.github/workflows/backend-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: InnoUni/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
